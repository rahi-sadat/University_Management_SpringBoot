# Loaded with @TestPropertySource so personal environment variables cannot redirect tests.
spring.datasource.url=jdbc:h2:mem:university_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
app.bootstrap-admin.email=bootstrap@test.local
app.bootstrap-admin.password=TestBootstrap!123
# Public test-only key, never used by production configuration.
app.jwt.secret=MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
app.jwt.expires-in=3600
spring.jackson.deserialization.fail-on-unknown-properties=true
debug=false
logging.level.root=WARN
logging.level.org.springframework=WARN
logging.level.org.hibernate=WARN
