spring.application.name=university-management
server.port=${SERVER_PORT:8081}
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/${DB_NAME:university_management}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:university_user}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:}}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
app.bootstrap-admin.email=${APP_BOOTSTRAP_ADMIN_EMAIL:${ADMIN_EMAIL:admin@university.local}}
app.bootstrap-admin.password=${APP_BOOTSTRAP_ADMIN_PASSWORD:${ADMIN_PASSWORD:}}
app.jwt.secret=${JWT_SECRET}
app.jwt.expires-in=${JWT_EXPIRES_IN:3600}
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
spring.jackson.deserialization.fail-on-unknown-properties=true
