
name: University Management Tests

on:
  push:
    branches:
      - testing
      - main

  pull_request:
    branches:
      - testing
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Make Maven Wrapper Executable
        run: chmod +x mvnw

      - name: Run All Tests
        run: ./mvnw --batch-mode clean test
